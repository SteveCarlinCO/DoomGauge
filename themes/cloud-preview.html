<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word cloud preview — floating</title>
<style>
body { background: #0e1424; color: #e8eaf0; font-family: system-ui, sans-serif; padding: 32px 20px; }
h2 { font-size: 14px; letter-spacing: 4px; color: #8b93a7; text-align: center; }
.note { text-align: center; color: #8b93a7; font-size: 12px; margin-top: 16px; }

</style></head>
<body>
<h2>DOOM WORDS</h2>
<div class="cloud" id="wordCloud">
<span class="cloud-word" style="font-size:40px;opacity:0.95;color:hsl(200,70%,80%);text-shadow:0 0 14px hsla(200,80%,70%,0.55);" title="506 doom-weight">war</span> <span class="cloud-word" style="font-size:36px;opacity:0.87;color:hsl(204,70%,80%);text-shadow:0 0 14px hsla(204,80%,70%,0.55);" title="425 doom-weight">killed</span> <span class="cloud-word" style="font-size:26px;opacity:0.69;color:hsl(208,70%,80%);text-shadow:0 0 14px hsla(208,80%,70%,0.55);" title="240 doom-weight">shooting</span> <span class="cloud-word" style="font-size:25px;opacity:0.66;color:hsl(212,70%,80%);text-shadow:0 0 14px hsla(212,80%,70%,0.55);" title="208 doom-weight">crisis</span> <span class="cloud-word" style="font-size:23px;opacity:0.62;color:hsl(216,70%,80%);text-shadow:0 0 14px hsla(216,80%,70%,0.55);" title="168 doom-weight">attack</span> <span class="cloud-word" style="font-size:21px;opacity:0.58;color:hsl(220,70%,80%);text-shadow:0 0 14px hsla(220,80%,70%,0.55);" title="132 doom-weight">deadly</span> <span class="cloud-word" style="font-size:20px;opacity:0.57;color:hsl(224,70%,80%);text-shadow:0 0 14px hsla(224,80%,70%,0.55);" title="120 doom-weight">missile</span> <span class="cloud-word" style="font-size:20px;opacity:0.57;color:hsl(228,70%,80%);text-shadow:0 0 14px hsla(228,80%,70%,0.55);" title="120 doom-weight">death</span> <span class="cloud-word" style="font-size:19px;opacity:0.55;color:hsl(232,70%,80%);text-shadow:0 0 14px hsla(232,80%,70%,0.55);" title="100 doom-weight">nuclear</span> <span class="cloud-word" style="font-size:18px;opacity:0.52;color:hsl(236,70%,80%);text-shadow:0 0 14px hsla(236,80%,70%,0.55);" title="70 doom-weight">strike</span> <span class="cloud-word" style="font-size:17px;opacity:0.51;color:hsl(240,70%,80%);text-shadow:0 0 14px hsla(240,80%,70%,0.55);" title="64 doom-weight">collapse</span> <span class="cloud-word" style="font-size:17px;opacity:0.5;color:hsl(244,70%,80%);text-shadow:0 0 14px hsla(244,80%,70%,0.55);" title="54 doom-weight">disaster</span> <span class="cloud-word" style="font-size:16px;opacity:0.5;color:hsl(248,70%,80%);text-shadow:0 0 14px hsla(248,80%,70%,0.55);" title="48 doom-weight">crash</span> <span class="cloud-word" style="font-size:16px;opacity:0.49;color:hsl(252,70%,80%);text-shadow:0 0 14px hsla(252,80%,70%,0.55);" title="40 doom-weight">terror</span> <span class="cloud-word" style="font-size:16px;opacity:0.49;color:hsl(256,70%,80%);text-shadow:0 0 14px hsla(256,80%,70%,0.55);" title="36 doom-weight">threat</span> <span class="cloud-word" style="font-size:16px;opacity:0.48;color:hsl(260,70%,80%);text-shadow:0 0 14px hsla(260,80%,70%,0.55);" title="30 doom-weight">genocide</span> <span class="cloud-word" style="font-size:16px;opacity:0.48;color:hsl(264,70%,80%);text-shadow:0 0 14px hsla(264,80%,70%,0.55);" title="30 doom-weight">massacre</span> <span class="cloud-word" style="font-size:16px;opacity:0.48;color:hsl(268,70%,80%);text-shadow:0 0 14px hsla(268,80%,70%,0.55);" title="30 doom-weight">warns</span> <span class="cloud-word" style="font-size:15px;opacity:0.48;color:hsl(272,70%,80%);text-shadow:0 0 14px hsla(272,80%,70%,0.55);" title="28 doom-weight">terrorist</span> <span class="cloud-word" style="font-size:15px;opacity:0.47;color:hsl(276,70%,80%);text-shadow:0 0 14px hsla(276,80%,70%,0.55);" title="24 doom-weight">flood</span>
</div>
<div class="note">Live preview — words drift around the section.</div>
<script>
function floatCloud() {
  var el = document.getElementById('wordCloud');
  var words = el.querySelectorAll('.cloud-word');
  if (!words.length) return;
  var H = 230;
  el.style.position = 'relative'; el.style.height = H + 'px';
  el.style.overflow = 'hidden'; el.style.textAlign = 'left'; el.style.lineHeight = '1.4';
  var W = el.clientWidth || 600, cols = 5, rows = 4, items = [];
  words.forEach(function (w, i) {
    w.style.position = 'absolute'; w.style.margin = '0'; w.style.left = '0'; w.style.top = '0';
    var ww = w.offsetWidth || 80, wh = w.offsetHeight || 28;
    var col = i % cols, row = Math.floor(i / cols) % rows;
    var x = ((col + 0.5) / cols) * W + (Math.random() - 0.5) * 50 - ww / 2;
    var y = ((row + 0.5) / rows) * H + (Math.random() - 0.5) * 24 - wh / 2;
    x = Math.max(0, Math.min(W - ww, x)); y = Math.max(0, Math.min(H - wh, y));
    var ang = Math.random() * Math.PI * 2, sp = 5 + Math.random() * 11;
    items.push({ el: w, x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp * 0.7 });
  });
  var last = null;
  function tick(now) {
    if (last === null) last = now;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var W2 = el.clientWidth || W;
    items.forEach(function (it) {
      it.x += it.vx * dt; it.y += it.vy * dt;
      var ww = it.el.offsetWidth || 80, wh = it.el.offsetHeight || 28;
      if (it.x <= 0) { it.x = 0; it.vx = Math.abs(it.vx); }
      else if (it.x + ww >= W2) { it.x = W2 - ww; it.vx = -Math.abs(it.vx); }
      if (it.y <= 0) { it.y = 0; it.vy = Math.abs(it.vy); }
      else if (it.y + wh >= H) { it.y = H - wh; it.vy = -Math.abs(it.vy); }
      it.el.style.transform = 'translate(' + it.x.toFixed(1) + 'px,' + it.y.toFixed(1) + 'px)';
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
floatCloud();
</script>
</body></html>
