name: Deploy zip
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip deploy package
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "no zip found, nothing to do"; exit 0; fi
          ZIP=$(ls -t *.zip | head -1)
          echo "Deploying $ZIP"
          unzip -o -q "$ZIP"
          if [ -d doom-gauge-github ]; then
            cp -r doom-gauge-github/. .
            rm -rf doom-gauge-github
          fi
          rm -f *.zip
          git config user.name "doom-deploy-bot"
          git config user.email "doom-deploy-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "deploy ${ZIP}"
            git push
          fi