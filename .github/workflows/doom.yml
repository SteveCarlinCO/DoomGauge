name: Doom Gauge fetch

on:
  schedule:
    - cron: "17 * * * *"  # hourly, a few minutes past the hour
  workflow_dispatch:       # manual "Run workflow" button

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds and score doom
        run: python3 fetch_doom.py
      - name: Commit updated data
        run: |
          git config user.name "doom-gauge-bot"
          git config user.email "doom-gauge-bot@users.noreply.github.com"
          git add doom.json history.json
          git diff --cached --quiet || git commit -m "doom update $(date -u +%FT%TZ)" && git push
